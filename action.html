<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互动评论 - 童的个人博客</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">童的博客</a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="article.html">文章</a></li>
                <li><a href="action.html" class="active">互动</a></li>
                <li><a href="contact.html">联系</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主要内容区 -->
    <main class="page-container">
        <h1 class="page-title">互动评论</h1>
        <p style="text-align: center; color: #666; margin-bottom: 2rem;">欢迎在下方留言，分享您的想法和见解</p>
        
        <!-- Utterances 评论系统 -->
        <script src="https://utteranc.es/client.js"
            repo="185www/comments"
            issue-term="pathname"
            theme="github-light"
            crossorigin="anonymous"
            async>
        </script>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2025 童的个人博客 · 保留所有权利</p>
            <p class="footer-note">用文字记录生活，用思考照亮前路</p>
        </div>
    </footer>
</body>
</html>
