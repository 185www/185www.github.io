<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>新生 — 21天改变计划</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f0eb;--surface:#ffffff;--surface2:#e8e4de;--accent:#2d8f4e;--accent2:#e85d3a;--gold:#d4a843;--text:#2c2420;--dim:#8a7e72;--muted:#b8b0a6;--radius:16px}
html{font-size:18px}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.8;overflow-x:hidden;font-size:.95rem;min-height:100vh}
.hidden{display:none!important}

/* HEADER */
.app-header{display:flex;align-items:center;justify-content:space-between;padding:.5rem .8rem;background:var(--surface);position:sticky;top:0;z-index:10;min-height:52px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.header-left{display:flex;align-items:center;gap:.4rem}
.header-icon{font-size:1.3rem}
.header-title{font-weight:700;font-size:1rem;color:var(--accent)}
.header-badge{background:var(--accent);color:#fff;font-size:.6rem;padding:.12rem .45rem;border-radius:99px;font-weight:600}
.emergency-btn{background:var(--accent2);color:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:1.1rem;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(232,93,58,.3)}
.emergency-btn:active{transform:scale(.92)}

/* HOME PAGE */
#app{padding:.6rem;max-width:480px;margin:0 auto;padding-bottom:2rem}
.home-day-label{text-align:center;font-size:.8rem;color:var(--dim);margin-bottom:.2rem}
.home-title{text-align:center;font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:.6rem}

/* TREE */
.tree-section{background:var(--surface);border-radius:var(--radius);padding:.8rem;margin-bottom:.6rem;text-align:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tree-section svg{width:100%;max-width:180px;height:160px}
.tree-streak{font-size:.8rem;color:var(--dim);margin-top:.1rem}
.tree-streak strong{color:var(--accent);font-size:1rem}

/* CHALLENGE CARD */
.challenge-card{background:var(--surface);border-radius:var(--radius);padding:1rem;margin-bottom:.8rem;border-left:4px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.challenge-label{font-size:.7rem;color:var(--dim);font-weight:600;margin-bottom:.2rem;letter-spacing:1px}
.challenge-text{font-size:1.05rem;color:var(--text);font-weight:500;line-height:1.5}
.challenge-diff{font-size:.7rem;color:var(--dim);margin-top:.3rem}

/* MAIN BUTTON */
.checkin-btn{display:block;width:100%;padding:1rem;font-size:1.1rem;font-weight:700;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;text-align:center;min-height:56px;margin-bottom:.8rem;box-shadow:0 4px 12px rgba(45,143,78,.25);font-family:inherit;letter-spacing:1px}
.checkin-btn:active{transform:scale(.97);box-shadow:0 2px 6px rgba(45,143,78,.2)}

/* FOOTER LINKS */
.footer-links{display:flex;justify-content:space-around;padding:.3rem 0;gap:.3rem}
.footer-link{background:var(--surface);border:1px solid var(--surface2);border-radius:12px;padding:.6rem .8rem;font-size:.8rem;cursor:pointer;text-align:center;flex:1;color:var(--dim);font-family:inherit;min-height:44px}
.footer-link:active{background:var(--surface2);transform:scale(.97)}

/* MODAL */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
.modal-overlay.centered{align-items:center}
.modal-sheet{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:1.2rem 1rem;padding-bottom:env(safe-area-inset-bottom,1.2rem);animation:slideUp .25s ease}
.modal-centered{background:var(--surface);border-radius:var(--radius);width:92%;max-width:440px;max-height:85vh;overflow-y:auto;padding:1.4rem;animation:fadeIn .2s ease}
.modal-title{font-size:1rem;font-weight:700;text-align:center;margin-bottom:.6rem;color:var(--text)}
.modal-text{font-size:.88rem;color:var(--text);line-height:1.7;margin-bottom:.8rem;white-space:pre-wrap}
.modal-close{display:block;width:100%;padding:.8rem;background:var(--surface2);border:none;border-radius:12px;font-size:.9rem;cursor:pointer;font-family:inherit;color:var(--text);text-align:center;margin-top:.5rem}
.modal-close:active{opacity:.7}

/* CHECKIN OPTIONS */
.checkin-options{display:flex;flex-direction:column;gap:.4rem;margin:.6rem 0}
.checkin-opt{background:var(--surface);border:2px solid var(--surface2);border-radius:12px;padding:.85rem;font-size:.88rem;cursor:pointer;text-align:center;font-family:inherit;color:var(--text);min-height:50px;transition:all .1s}
.checkin-opt:active{background:var(--accent);color:#fff;border-color:var(--accent);transform:scale(.97)}
.checkin-opt.success{border-color:var(--accent);background:var(--accent);color:#fff}
.checkin-opt.tried{border-color:var(--gold);background:var(--gold);color:#fff}
.checkin-opt.fail{border-color:var(--muted);background:var(--muted);color:#fff}
.checkin-opt:disabled{opacity:.3;transform:none}

/* FAMILY CONNECT */
.family-section{background:var(--surface);border-radius:var(--radius);padding:1rem;margin-top:.6rem;border:1px solid var(--gold);text-align:center}
.family-title{font-size:.9rem;font-weight:600;color:var(--gold);margin-bottom:.5rem}
.family-btn{display:inline-block;padding:.7rem 1.2rem;background:var(--gold);color:#fff;border:none;border-radius:12px;font-size:.88rem;cursor:pointer;font-family:inherit;font-weight:600;margin:.3rem}
.family-btn:active{opacity:.8}
.family-skip{display:inline-block;padding:.5rem;background:none;border:none;color:var(--dim);font-size:.8rem;cursor:pointer;font-family:inherit}

/* FEEDBACK */
.feedback-text{font-size:.9rem;color:var(--text);line-height:1.7;margin-bottom:.6rem;white-space:pre-wrap}
.feedback-text .highlight{color:var(--accent);font-weight:600}

/* PROGRESS MODAL */
.progress-stat{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--surface2);font-size:.85rem}
.progress-stat:last-child{border-bottom:none}
.progress-stat .label{color:var(--dim)}
.progress-stat .value{font-weight:600;color:var(--text)}
.progress-bar-bg{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin:.4rem 0}
.progress-bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .5s ease}

/* EMERGENCY */
#page-emergency{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:150;overflow-y:auto;padding:.6rem;display:none;flex-direction:column}
#page-emergency.active{display:flex}
.emerg-header{display:flex;align-items:center;justify-content:space-between;padding:.3rem 0;margin-bottom:.4rem}
.emerg-title{font-size:1.1rem;font-weight:600;color:var(--accent2)}
.emerg-close{background:none;border:none;color:var(--dim);font-size:1.2rem;cursor:pointer;font-family:inherit;padding:.3rem}
.emerg-sub{text-align:center;color:var(--dim);font-size:.82rem;margin-bottom:.5rem}
.emerg-btn{display:flex;align-items:center;gap:.6rem;background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:.9rem;font-size:.95rem;cursor:pointer;text-align:left;font-family:inherit;color:var(--text);line-height:1.4;min-height:56px;margin-bottom:.35rem;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.emerg-btn:active{transform:scale(.97);border-color:var(--accent2)}
.emerg-icon{font-size:1.6rem;flex-shrink:0}
.emerg-label{font-weight:600;font-size:.92rem}
.emerg-desc{font-size:.78rem;color:var(--dim);margin-top:.05rem}
.emerg-step{margin:.4rem 0}
.emerg-tier-label{font-size:.75rem;color:var(--accent2);font-weight:600;margin-bottom:.2rem}
.emerg-next-btn{display:block;width:100%;padding:.85rem;background:var(--accent2);color:#fff;border:none;border-radius:12px;font-size:.9rem;cursor:pointer;text-align:center;font-family:inherit;min-height:50px;margin:.5rem 0}
.emerg-next-btn:active{opacity:.8}
.emerg-chat{background:var(--surface);border-radius:var(--radius);padding:.8rem;margin:.3rem 0}
.emerg-chat .msg{background:var(--surface2);border-radius:12px;padding:.7rem .9rem;margin-bottom:.3rem;font-size:.85rem;line-height:1.6;white-space:pre-wrap}
.emerg-chat .msg.user{background:var(--accent);color:#fff}

/* TOAST */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#fff;padding:.6rem 1.2rem;border-radius:10px;font-size:.88rem;z-index:999;animation:fadeOut 2.8s ease forwards;white-space:nowrap;pointer-events:none;max-width:90%;text-align:center}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes slideUp{0%{transform:translateY(30px);opacity:0}100%{transform:translateY(0);opacity:1}}

/* WELCOME (S0) */
.welcome-screen{text-align:center;padding:.8rem 0}
.welcome-title{font-size:1.3rem;font-weight:700;color:var(--accent);margin-bottom:.3rem}
.welcome-sub{color:var(--dim);font-size:.85rem;margin-bottom:.8rem;line-height:1.5}
.welcome-start{display:block;width:100%;padding:1rem;font-size:1.1rem;font-weight:700;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;font-family:inherit;min-height:56px;box-shadow:0 4px 12px rgba(45,143,78,.25)}
.welcome-start:active{transform:scale(.97)}

/* S0 CHAT */
.s0-chat{background:var(--surface);border-radius:var(--radius);padding:.8rem;margin:.5rem 0;max-height:60vh;overflow-y:auto}
.s0-msg{background:var(--surface2);border-radius:12px;padding:.7rem .9rem;margin-bottom:.4rem;font-size:.85rem;line-height:1.6;white-space:pre-wrap;animation:fadeIn .2s ease}
.s0-msg.coach{border-bottom-left-radius:4px}
.s0-msg.user{background:var(--accent);color:#fff;border-bottom-right-radius:4px;text-align:right}
.s0-options{display:flex;flex-direction:column;gap:.3rem;margin:.3rem 0;animation:fadeIn .2s ease}
.s0-opt{background:var(--surface);border:2px solid var(--surface2);border-radius:12px;padding:.8rem;font-size:.85rem;cursor:pointer;text-align:left;font-family:inherit;color:var(--text);min-height:46px}
.s0-opt:active{background:var(--accent);color:#fff;border-color:var(--accent);transform:scale(.97)}
.s0-opt:disabled{opacity:.3;transform:none}
.s0-typing{align-self:flex-start;display:flex;gap:4px;padding:.5rem .8rem;background:var(--surface2);border-radius:12px;border-bottom-left-radius:4px;margin-bottom:.4rem;width:fit-content}
.s0-typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.4s infinite ease-in-out}
.s0-typing span:nth-child(2){animation-delay:.2s}
.s0-typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.protector-input{display:flex;gap:.3rem;margin:.3rem 0}
.protector-input input{flex:1;padding:.7rem;border:2px solid var(--surface2);border-radius:10px;font-size:.88rem;font-family:inherit;background:var(--surface);color:var(--text);outline:none}
.protector-input input:focus{border-color:var(--accent)}
.protector-input button{padding:.7rem 1rem;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:.88rem;cursor:pointer;font-family:inherit;font-weight:600}
</style>
</head>
<body>

<div class="app-header">
  <div class="header-left">
    <span class="header-icon">🌱</span>
    <span class="header-title">新生</span>
    <span class="header-badge" id="h-badge"></span>
  </div>
  <button class="emergency-btn" id="h-emergency" title="紧急救援">🆘</button>
</div>

<div id="app"></div>

<!-- EMERGENCY PAGE -->
<div id="page-emergency">
  <div class="emerg-header">
    <span class="emerg-title">🆘 现在需要什么？</span>
    <button class="emerg-close" id="emerg-close">✕</button>
  </div>
  <div id="emerg-content"></div>
</div>

<script>
// ═══════════════════════════════════════
// STORAGE LAYER
// ═══════════════════════════════════════
(function(){
var K = 'xsheng_v6'
function def() {
  return {
    phase: 's0', s0Complete: false, s0Node: null,
    day: 1, checkinHistory: [], lastCheckinType: null, lastCheckinDay: 0,
    consecutiveSuccess: 0, difficulty: 'easy', treeGrowth: 0,
    protectorName: '', protectorSet: false, totalCheckins: 0, created: Date.now()
  }
}
function load() {
  try {
    var r = localStorage.getItem(K)
    if (r) { var o = JSON.parse(r); if (o && typeof o === 'object') return o }
  } catch(e) {}
  return def()
}
function save(o) {
  try { localStorage.setItem(K, JSON.stringify(o)) } catch(e) {}
}
function reset() {
  try { localStorage.removeItem(K) } catch(e) {}
  return def()
}
window.STORE = {
  get: load, save: save, reset: reset,
  update: function(fn) { var o = load(); fn(o); save(o); return o }
}
})();

// ═══════════════════════════════════════
// S0 — 首次激活对话（20节点）
// ═══════════════════════════════════════
var S0 = [
  {
    id: 'welcome',
    coach: '你好，老哥/老姐。感谢你愿意花时间跟我聊聊。我不是医生，也不是老师，就是一个想帮你的朋友。在开始之前，我想先了解你这个人——不是你的习惯，是你这个人。你小时候在哪儿长大的？',
    opts: [
      { t: '🏠 农村，小时候吃过苦', n: 'childhood_rural' },
      { t: '🏙️ 城里，普普通通', n: 'childhood_city' },
      { t: '❓ 不太想回忆', n: 'childhood_skip' }
    ]
  },
  {
    id: 'childhood_rural',
    coach: '农村长大的孩子，都吃过苦。下地干活、割猪草、挑水——可就是那样的日子，养出了咱们这代人最硬的骨头。那时候虽然穷，但心里踏实。你那时候最开心的事是什么？',
    opts: [
      { t: '🎣 和小伙伴去河边摸鱼', n: 'happy_memory' },
      { t: '🏃 满村跑着玩', n: 'happy_memory' },
      { t: '🍚 过年才能吃上肉', n: 'happy_memory' },
      { t: '📚 喜欢读书', n: 'happy_memory' }
    ]
  },
  {
    id: 'childhood_city',
    coach: '城里长大的孩子，条件好一些，但也有自己的难处。家里地方小，兄弟姐妹挤一张床。那时候的快乐很简单，跟现在不一样。你最怀念小时候的什么？',
    opts: [
      { t: '🎮 和小伙伴一起玩', n: 'happy_memory' },
      { t: '🍦 攒钱买零食', n: 'happy_memory' },
      { t: '📺 看电视是最开心的事', n: 'happy_memory' },
      { t: '📖 喜欢看书学习', n: 'happy_memory' }
    ]
  },
  {
    id: 'childhood_skip',
    coach: '行，不想说就不说。咱们换一个——你这一辈子，有没有一件事让你特别自豪的？把孩子养大？工作上做出过成绩？还是帮过别人？每个人心里都有一件得意的事。',
    opts: [
      { t: '💪 把孩子培养成人', n: 'proud_child' },
      { t: '🏢 工作上出过成绩', n: 'proud_work' },
      { t: '❤️ 帮过别人', n: 'proud_help' },
      { t: '😔 好像没什么自豪的', n: 'proud_none' }
    ]
  },
  {
    id: 'happy_memory',
    coach: '那种简单的快乐，现在想想心里都暖。那时候没有手机，没有电视，但有的是真真切切的日子。后来日子好了，反而有些东西不见了。你觉得是什么变了？',
    opts: [
      { t: '😔 快乐少了，压力大了', n: 'happiness_lost' },
      { t: '📱 太依赖手机了', n: 'phone_dep' },
      { t: '🍺 心里有事就靠烟酒', n: 'smoke_dep' }
    ]
  },
  {
    id: 'happiness_lost',
    coach: '人长大了，背的东西多了，快乐的门槛也高了。你已经很久没有好好看看自己了。你知道你什么时候最容易想抽烟/喝酒/刷手机吗？',
    opts: [
      { t: '🍚 吃完饭', n: 'trigger_after' },
      { t: '😤 心情不好', n: 'trigger_after' },
      { t: '👥 跟人一起的时候', n: 'trigger_after' },
      { t: '😐 没事干无聊', n: 'trigger_after' }
    ]
  },
  {
    id: 'phone_dep',
    coach: '手机这个东西太厉害了，专门偷人的时间。你本来就想看两分钟，一抬头俩小时过去了。它比烟酒还难防。你知道你什么时候最容易拿起手机？或者你最想改的是烟还是酒还是手机？',
    opts: [
      { t: '🚬 最想改抽烟', n: 'focus_smoke' },
      { t: '🍺 最想改喝酒', n: 'focus_alcohol' },
      { t: '📱 最想改刷手机', n: 'focus_phone' },
      { t: '🍚 饭后最想来一根', n: 'trigger_after' }
    ]
  },
  {
    id: 'smoke_dep',
    coach: '烟酒是咱们这代人学会的"解压方式"。以前有什么事忍忍就过去了。后来上了年纪，心里的事多了，就开始靠这些。我理解你。你不是离不开烟酒，你是离不开"那个放松的感觉"。但你最想改的是哪个？',
    opts: [
      { t: '🚬 抽烟', n: 'focus_smoke' },
      { t: '🍺 喝酒', n: 'focus_alcohol' },
      { t: '📱 刷手机', n: 'focus_phone' }
    ]
  },
  {
    id: 'trigger_after',
    coach: '你心里其实明白自己的习惯。你只是不知道怎么改。很多人改不成，不是因为没毅力——是因为方法不对。你试过戒烟/戒酒/戒手机吗？',
    opts: [
      { t: '💪 试过好多次', n: 'tried_many' },
      { t: '😅 试过但没坚持住', n: 'tried_many' },
      { t: '🤷 没认真试过', n: 'tried_none' },
      { t: '📱 最想改的问题', n: 'focus_choose' }
    ]
  },
  {
    id: 'tried_many',
    coach: '试过好多次就对了！你知道为什么吗？每次尝试都在你脑子里留下了一条新路的痕迹。就像走路，走多了就是大路。你不是失败了，你是在铺路。你最想改什么？',
    opts: [
      { t: '🚬 抽烟', n: 'focus_smoke' },
      { t: '🍺 喝酒', n: 'focus_alcohol' },
      { t: '📱 刷手机', n: 'focus_phone' }
    ]
  },
  {
    id: 'tried_none',
    coach: '那你想试试吗？不是让你"永远戒掉"——是21天，每天做一件很小的事。21天你愿意试试吗？',
    opts: [
      { t: '✅ 21天可以试试', n: 'focus_ask' },
      { t: '🤔 我先想想', n: 'focus_ask' },
      { t: '🚬 其实我最想改的是……', n: 'focus_choose' }
    ]
  },
  {
    id: 'focus_smoke',
    coach: '行，那咱们就专注在抽烟上。你一天大概抽多少？',
    opts: [
      { t: '📊 半包以下（<10根）', n: 'focus_set', e: 'setFocus("smoke","light")' },
      { t: '📊 一包左右（10-20根）', n: 'focus_set', e: 'setFocus("smoke","medium")' },
      { t: '📊 一包以上（>20根）', n: 'focus_set', e: 'setFocus("smoke","heavy")' },
      { t: '🤷 没数过', n: 'focus_set', e: 'setFocus("smoke","medium")' }
    ]
  },
  {
    id: 'focus_alcohol',
    coach: '行，那咱们专注在喝酒上。你一般多久喝一次？',
    opts: [
      { t: '📊 每天都要喝', n: 'focus_set', e: 'setFocus("alcohol","heavy")' },
      { t: '📊 一周几次', n: 'focus_set', e: 'setFocus("alcohol","medium")' },
      { t: '📊 偶尔喝一点', n: 'focus_set', e: 'setFocus("alcohol","light")' }
    ]
  },
  {
    id: 'focus_phone',
    coach: '行，那咱们专注在手机上。你每天大概刷多久？',
    opts: [

var $ = function(id) { return document.getElementById(id) }
var state = STORE.get()
var focus = null // set during S0

function save() { STORE.save(state) }

// ─── TTS ───
var ttsEnabled = true
function speak(text) {
  if (!ttsEnabled || !('speechSynthesis' in window)) return
  window.speechSynthesis.cancel()
  var u = new SpeechSynthesisUtterance(text)
  u.lang = 'zh-CN'
  u.rate = 0.85
  u.pitch = 1.0
  u.volume = 1.0
  try { window.speechSynthesis.speak(u) } catch(e) {}
}

// ─── TOAST ───
function showToast(msg) {
  var el = document.querySelector('.toast')
  if (el) el.remove()
  var t = document.createElement('div')
  t.className = 'toast'
  t.textContent = msg
  document.body.appendChild(t)
  setTimeout(function() { if (t.parentNode) t.remove() }, 2800)
}

// ─── MODAL ───
function showModal(html, centered) {
  var overlay = document.createElement('div')
  overlay.className = 'modal-overlay' + (centered ? ' centered' : '')
  var sheet = document.createElement('div')
  sheet.className = centered ? 'modal-centered' : 'modal-sheet'
  sheet.innerHTML = html
  overlay.appendChild(sheet)
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.remove()
  })
  document.body.appendChild(overlay)
  return { overlay: overlay, sheet: sheet, close: function() { overlay.remove() } }
}

// ─── TREE SVG ───
function renderTreeSVG(growth) {
  var pct = Math.min(growth, 100)
  var crownSize = Math.min(10 + pct * 0.4, 50)
  var crownOpacity = Math.min(0.3 + pct * 0.006, 0.9)
  var leafCount = Math.floor(pct / 10)
  var buds = Math.floor(pct / 25)
  
  var svg = '<svg viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">'
  svg += '<ellipse cx="60" cy="155" rx="40" ry="6" fill="#d4c8a8"/>'
  
  // trunk
  var trunkH = 30 + pct * 0.6
  svg += '<rect x="56" y="' + (155 - trunkH) + '" width="8" height="' + trunkH + '" rx="3" fill="#8a7e72"/>'
  
  // branches appear after 20%
  if (pct >= 20) {
    var bh = 155 - trunkH
    svg += '<line x1="60" y1="' + (bh + 20) + '" x2="40" y2="' + (bh + 5) + '" stroke="#8a7e72" stroke-width="3" stroke-linecap="round"/>'
    svg += '<line x1="60" y1="' + (bh + 10) + '" x2="80" y2="' + (bh - 5) + '" stroke="#8a7e72" stroke-width="3" stroke-linecap="round"/>'
  }
  
  // crown
  var cy = 155 - trunkH - 10
  if (cy < 20) cy = 20
  svg += '<ellipse cx="60" cy="' + cy + '" rx="' + Math.min(15 + pct * 0.3, 38) + '" ry="' + Math.min(10 + pct * 0.2, 28) + '" fill="rgba(45,143,78,' + crownOpacity + ')"/>'
  
  // leaves/blooms
  for (var i = 0; i < leafCount && i < 8; i++) {
    var angle = (i / 8) * Math.PI * 2
    var r = Math.min(15 + pct * 0.15, 30)
    var lx = 60 + Math.cos(angle) * r * 0.8
    var ly = cy - Math.sin(angle) * r * 0.6
    svg += '<circle cx="' + lx + '" cy="' + ly + '" r="3" fill="#d4a843"/>'
  }
  
  // buds
  for (var i = 0; i < buds && i < 3; i++) {
    svg += '<circle cx="' + (50 + i * 12) + '" cy="' + (cy + 5) + '" r="2.5" fill="#e85d3a" opacity="0.7"/>'
  }
  
  svg += '<text x="60" y="172" text-anchor="middle" fill="#8a7e72" font-size="9">第 ' + state.day + ' 天</text>'
  svg += '</svg>'
  return svg
}

// ─── CHECKIN FLOW ───
function startCheckin() {
  var d = state.day
  var dayData = DAYS[d]
  if (!dayData) { renderComplete(); return }
  
  // If night already completed today, all done
  if (state.lastCheckinDay === d && state.lastCheckinType === 'night') {
    showToast('今天的签到全部完成，明天继续！🎉')
    return
  }
  
  var types = ['morning','noon','evening','night']
  var lastType = state.lastCheckinType
  
  var idx = 0
  if (state.lastCheckinDay === d && lastType) {
    idx = types.indexOf(lastType) + 1
  }
  if (idx >= types.length) { showToast('今天的签到都完成了！'); return }
  
  var type = types[idx]
  showCheckinModal(type, dayData)
}

function showCheckinModal(type, dayData) {
  var content
  var isNight = type === 'night'
  
  if (type === 'morning') {
    if (dayData.morning.btns) {
      var btns = dayData.morning.btns.map(function(b) {
        return '<button class="checkin-opt success" data-result="done">' + b + '</button>'
      }).join('')
      content =
        '<div class="modal-title">🌅 早上签到</div>' +
        '<div class="modal-text">' + dayData.morning.text + '</div>' +
        '<div class="checkin-options">' + btns + '</div>'
    } else {
      content =
        '<div class="modal-title">🌅 早上签到</div>' +
        '<div class="modal-text">' + dayData.morning.text + '</div>' +
        '<div class="checkin-options">' +
          '<button class="checkin-opt success" data-result="done">' + (dayData.morning.btn || '记住了 ✅') + '</button>' +
        '</div>'
    }
  } else if (type === 'noon') {
    var btns = dayData.noon.btns.map(function(b, i) {
      return '<button class="checkin-opt" data-result="' + (i === 0 ? 'good' : 'bad') + '">' + b + '</button>'
    }).join('')
    content =
      '<div class="modal-title">☀️ 中午签到</div>' +
      '<div class="modal-text">' + dayData.noon.text + '</div>' +
      '<div class="checkin-options">' + btns + '</div>'
  } else if (type === 'evening') {
    var btns = dayData.evening.btns.map(function(b, i) {
      return '<button class="checkin-opt" data-result="' + (i === 0 ? 'good' : 'bad') + '">' + b + '</button>'
    }).join('')
    content =
      '<div class="modal-title">🌆 傍晚签到</div>' +
      '<div class="modal-text">' + dayData.evening.text + '</div>' +
      '<div class="checkin-options">' + btns + '</div>'
  } else {
    var btns = dayData.night.btns.map(function(b, i) {
      var cls = ['success','tried','fail'][i] || ''
      return '<button class="checkin-opt ' + cls + '" data-result="' + (i === 0 ? 'success' : i === 1 ? 'tried' : 'fail') + '">' + b + '</button>'
    }).join('')
    content =
      '<div class="modal-title">🌙 晚间报告</div>' +
      '<div class="modal-text">' + dayData.night.question + '</div>' +
      '<div class="checkin-options">' + btns + '</div>'
  }
  
  var m = showModal(content, true)
  
  m.sheet.querySelectorAll('.checkin-opt').forEach(function(btn) {
    btn.onclick = function() {
      var result = btn.dataset.result
      m.close()
      handleCheckin(type, result, dayData)
    }
  })
}

function handleCheckin(type, result, dayData) {
  state.lastCheckinType = type
  state.lastCheckinDay = state.day
  state.totalCheckins++
  
  if (type === 'night') {
    var success = result === 'success' || result === 'tried'
    var isSuccess = result === 'success'
    
    state.checkinHistory.push({
      day: state.day,
      type: 'night',
      success: isSuccess,
      timestamp: Date.now()
    })
    
    if (isSuccess) {
      state.consecutiveSuccess++
      state.treeGrowth = Math.min(state.treeGrowth + 10, 100)
    } else if (result === 'tried') {
      state.treeGrowth = Math.min(state.treeGrowth + 3, 100)
      state.consecutiveSuccess = 0
    } else {
      state.consecutiveSuccess = 0
    }
    
    save()
    showNightFeedback(isSuccess || result === 'tried')
  } else {
    state.checkinHistory.push({
      day: state.day,
      type: type,
      result: result,
      timestamp: Date.now()
    })
    save()
    renderHome()
    showToast(type === 'morning' ? '今天的挑战记住了！💪' : '已记录！👍')
  }
}

function showNightFeedback(didWell) {
  var protectorName = state.protectorName || '家人'
  
  var text = didWell
    ? '🎉 好！你今天又完成了一天。你做到了！'
    : '💪 没关系，明天继续。你已经比昨天多坚持了一天。'
  
  var feedbackText = didWell
    ? '连续 ' + state.consecutiveSuccess + ' 天达成。你的' + protectorName + '会为你骄傲的。'
    : '偶尔做不到是正常的。重要的是你还在坚持。明天再来。'
  
  // Check difficulty adaptation
  var recent = state.checkinHistory.filter(function(c) { return c.type === 'night' }).slice(-3)
  var recentSuccess = recent.filter(function(c) { return c.success }).length
  
  if (didWell && recentSuccess >= 3 && state.difficulty !== 'hard') {
    state.difficulty = 'hard'
    feedbackText += '\n\n🔥 你已经连续成功3天了！明天挑战升级。'
  } else if (didWell && recentSuccess >= 2 && state.difficulty === 'easy') {
    state.difficulty = 'normal'
    feedbackText += '\n\n👍 你做得很好！明天挑战升级到标准版。'
  } else if (!didWell && state.consecutiveSuccess === 0 && state.difficulty !== 'easy' && state.day > 1) {
    var fails = recent.filter(function(c) { return !c.success }).length
    if (fails >= 3) {
      state.difficulty = 'easy'
      feedbackText += '\n\n😊 咱们把难度降低一点，让你更容易成功。'
    }
  }
  
  if (didWell) {
    state.day++
    if (state.day > 21) state.day = 21
  }
  
  save()
  
  // Always move to next day on night report if success
  if (didWell && state.day < 21) {
    // already advanced
  }
  
  // Show feedback then family connect
  var m = showModal(
    '<div class="modal-text">' + text + '</div>' +
    '<div class="modal-text" style="color:var(--dim);font-size:.82rem">' + feedbackText + '</div>' +
    '<button class="checkin-opt success" id="night-ok-btn">好的 🙏</button>',
    true
  )
  
  $('night-ok-btn').onclick = function() {
    m.close()
    if (didWell && state.protectorSet) {
      showFamilyPrompt()
    } else if (state.day <= 21) {
      renderHome()
    } else {
      renderComplete()
    }
  }
}

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(function() { fallbackCopy(text) })
  } else {
    fallbackCopy(text)
  }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea')
  ta.value = text
  ta.style.position = 'fixed'
  ta.style.opacity = '0'
  document.body.appendChild(ta)
  ta.select()
  try { document.execCommand('copy') } catch(e) {}
  document.body.removeChild(ta)
}

  })
}

function hideEmergency() {
  $('page-emergency').classList.remove('active')
}

function showEmergencyTiers(item) {
  var content = $('emerg-content')
  content.innerHTML = ''
  var header = document.createElement('div')
  header.className = 'emerg-chat'
  header.innerHTML = '<div class="msg" style="font-weight:600;color:var(--accent2)">🆘 ' + item.icon + ' ' + item.label + '</div><div class="msg" style="color:var(--dim);font-size:.8rem">' + item.desc + '</div>'
  content.appendChild(header)
  
  var idx = 0
  function nextTier() {
    if (idx >= item.tiers.length) {
      var done = document.createElement('div')
      done.className = 'emerg-chat'
      done.innerHTML = '<div class="msg" style="color:var(--gold);text-align:center;font-weight:500">✅ 你完成了所有步骤。\n\n记住这个感觉——你靠自己撑过来了。</div>'
      content.appendChild(done)
      var back = document.createElement('button')
      back.className = 'emerg-next-btn'
      back.textContent = '🆘 还需要其他帮助吗？'
      back.onclick = showEmergencyPage
      content.appendChild(back)
      return
    }
    var tier = item.tiers[idx]
    var chat = document.createElement('div')
    chat.className = 'emerg-chat'
    chat.innerHTML = '<div class="msg"><span class="emerg-tier-label">' + tier.label + '</span>\n' + tier.coach + '</div>'
    content.appendChild(chat)
    
    var btn = document.createElement('button')
    btn.className = 'emerg-next-btn'
    btn.textContent = '✅ ' + tier.action
    btn.onclick = function() {
      btn.disabled = true
      btn.textContent = '✓ 完成'
      btn.style.opacity = '0.6'
      idx++
      setTimeout(nextTier, 400)
    }
    content.appendChild(btn)
    
    if (ttsEnabled) speak(tier.coach)
    content.scrollTop = content.scrollHeight
  }
  nextTier()
}

// ─── S0 FLOW ───
function startS0() {
  var app = $('app')
  app.innerHTML =
    '<div class="home-day-label">初次见面</div>' +
    '<div class="home-title">🌱 新生</div>' +
    '<div class="s0-chat" id="s0-chat"></div>'
  
  state.s0Node = null
  save()
  showS0Node(S0[0])
}

function showS0Node(node) {
  if (!node) {
    finishS0()
    return
  }
  state.s0Node = node.id
  save()
  
  var chat = $('s0-chat')
  
  // Typing indicator
  var typing = document.createElement('div')
  typing.className = 's0-typing'
  typing.innerHTML = '<span></span><span></span><span></span>'
  chat.appendChild(typing)
  chat.scrollTop = chat.scrollHeight
  
  var delay = Math.max(500, Math.min(2000, (node.coach || '').length * 15))
  
  setTimeout(function() {
    if (typing.parentNode) typing.remove()
    
    var msg = document.createElement('div')
    msg.className = 's0-msg coach'
    msg.textContent = node.coach
    chat.appendChild(msg)
    chat.scrollTop = chat.scrollHeight
    
    if (ttsEnabled) speak(node.coach)
    
    // Special: input mode (protector name)
    if (node.input) {
      var inputDiv = document.createElement('div')
      inputDiv.className = 'protector-input'
      var inp = document.createElement('input')
      inp.type = 'text'
      inp.placeholder = node.input.label
      inp.maxLength = 10
      var btn = document.createElement('button')
      btn.textContent = '确定'
      btn.onclick = function() {
        var val = inp.value.trim()
        if (!val) { showToast('请输入' + node.input.label); return }
        state[node.input.key] = val
        if (node.input.key === 'protectorName') state.protectorSet = true
        save()
        
        var userMsg = document.createElement('div')
        userMsg.className = 's0-msg user'
        userMsg.textContent = val
        chat.appendChild(userMsg)
        chat.scrollTop = chat.scrollHeight
        
        inputDiv.remove()
        var nextNode = S0[getS0Index('protector_set')]
        setTimeout(function() { showS0Node(nextNode) }, 500)
      }
      inputDiv.appendChild(inp)
      inputDiv.appendChild(btn)
      chat.appendChild(inputDiv)
      inp.focus()
      return
    }
    
    // Options
    if (node.opts && node.opts.length) {
      setTimeout(function() {
        var optDiv = document.createElement('div')
        optDiv.className = 's0-options'
        node.opts.forEach(function(opt) {
          var b = document.createElement('button')
          b.className = 's0-opt'
          b.textContent = opt.t
          b.onclick = function() {
            // Disable all buttons
            optDiv.querySelectorAll('.s0-opt').forEach(function(bb) { bb.disabled = true })
            
            var userMsg = document.createElement('div')
            userMsg.className = 's0-msg user'
            userMsg.textContent = opt.t
            chat.appendChild(userMsg)
            chat.scrollTop = chat.scrollHeight
            
            // Execute effect if any
            if (opt.e) {
              try { new Function(opt.e)() } catch(e) {}
            }
            
            if (opt.n) {
              var nextNode = getS0ById(opt.n)
              if (nextNode) setTimeout(function() { showS0Node(nextNode) }, 500)
              else finishS0()
            } else {
              finishS0()
            }
          }
          optDiv.appendChild(b)
        })
        chat.appendChild(optDiv)
        chat.scrollTop = chat.scrollHeight
      }, 400)
    } else {
      // No options -> auto finish
      setTimeout(finishS0, 1500)
    }
  }, delay)
}

function getS0ById(id) {
  for (var i = 0; i < S0.length; i++) {
    if (S0[i].id === id) return S0[i]
  }
  return null
}

function getS0Index(id) {
  for (var i = 0; i < S0.length; i++) {
    if (S0[i].id === id) return i
  }
  return -1
}

function finishS0() {
  state.phase = 'daily'
  state.s0Complete = true
  state.day = 1
  state.difficulty = 'easy'
  state.treeGrowth = 5 // Starting growth
  save()
  renderHome()
  showToast('🎉 明天开始第一天的挑战！')
}

// ─── SET FOCUS (called from S0) ───
function setFocus(f, level) {
  focus = f + ':' + level
}

// ─── INIT ───
function initUI() {
  state = STORE.get()
  
  // Emergency button
  $('h-emergency').onclick = showEmergencyPage
  $('emerg-close').onclick = hideEmergency
  
  // Route based on state
  if (state.phase === 's0' && !state.s0Complete) {
    startS0()
  } else {
    renderHome()
  }
}

function updateBadge() {
  var b = $('h-badge')
  if (state.phase === 's0' && !state.s0Complete) {
    b.textContent = '新朋友'
  } else if (state.day <= 21) {
    b.textContent = '第' + state.day + '天'
  } else {
    b.textContent = '完成'
  }
}

// ─── SW REGISTRATION ───
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js', { scope: '/xinsheng/' })
  })
}

// ─── START ───
initUI()
</script>
