<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>新生 — 对话式健康干预</title>
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<!-- ══════════════════════════════════════════════ -->
<!-- CHAT INTERFACE                                 -->
<!-- ══════════════════════════════════════════════ -->
<div id="page-chat" class="page active">
  <div id="chat-header">
    <span class="chat-avatar">🌱</span>
    <span class="chat-title">新生 · 健康教练</span>
  </div>
  <div id="chat-messages">
    <div class="msg coach">
      <p>你好。我是你的健康教练。</p>
      <p>我们会在接下来的21天里，每天聊一聊。</p>
      <p>这不是一个工具——这是一个对话。准备好了吗？</p>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════ -->
<!-- DASHBOARD                                      -->
<!-- ══════════════════════════════════════════════ -->
<div id="page-dashboard" class="page">
  <div class="dash-header">
    <h1 class="dash-title">🌱 新生</h1>
    <p class="dash-sub" id="d-day">第 0 天</p>
  </div>

  <!-- Progress -->
  <div class="card progress-card">
    <p class="section-label">21天干预进程</p>
    <div class="progress-track">
      <div class="progress-fill" id="d-progress-bar" style="width:0%"></div>
    </div>
    <p class="progress-text" id="d-progress-text">0 / 21 天</p>
  </div>

  <!-- Stats -->
  <div class="card stat-card">
    <div class="stat-row">
      <div class="stat-box">
        <span class="stat-num" id="d-streak">0</span>
        <span class="stat-label">成功天数</span>
      </div>
      <div class="stat-box">
        <span class="stat-num" id="d-triggers-count">0</span>
        <span class="stat-label">已识别触发</span>
      </div>
      <div class="stat-box">
        <span class="stat-num" id="d-focus-display">—</span>
        <span class="stat-label">当前专注</span>
      </div>
    </div>
  </div>

  <!-- Identity -->
  <div id="d-identity" class="card identity-card" style="display:none">
    <p class="identity-text" id="d-identity-text"></p>
  </div>

  <!-- Triggers -->
  <div id="d-triggers" class="card" style="display:none">
    <p id="d-triggers-text"></p>
  </div>

  <!-- Focus -->
  <div id="d-focus" class="card" style="display:none">
    <p id="d-focus-text"></p>
  </div>

  <!-- Continue session -->
  <button id="d-session-btn" class="btn-primary btn-lg">开始今天的会话</button>

  <!-- Reset -->
  <button id="d-reset-btn" class="btn-link">重新开始</button>
</div>

<!-- ══════════════════════════════════════════════ -->
<!-- BOTTOM NAV                                     -->
<!-- ══════════════════════════════════════════════ -->
<nav id="bottom-nav">
  <button class="nav-btn active" data-page="page-chat">
    <span class="nav-icon">💬</span>
    <span class="nav-label">对话</span>
  </button>
  <button class="nav-btn" data-page="page-dashboard">
    <span class="nav-icon">📊</span>
    <span class="nav-label">进度</span>
  </button>
</nav>

<script src="assets/js/storage.js"></script>
<script src="assets/js/protocol.js"></script>
<script src="assets/js/engine.js"></script>
</body>
</html>
