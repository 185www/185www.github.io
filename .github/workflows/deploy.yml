name: Deploy Pomotodo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pomotodo/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./pomotodo
        run: npm ci

      - name: Build
        working-directory: ./pomotodo
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/pomotodo
          destination_dir: pomotodo/
          keep_files: true
