name: Deploy Pomotodo to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'pomotodo/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy static files to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pomotodo
          destination_dir: pomotodo/
          keep_files: false
