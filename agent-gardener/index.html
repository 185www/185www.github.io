<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2d6a4f">
  <meta name="description" content="Agent Gardener - 其莳也若子，其置也若弃。管理你的 AI Agent 工作流，定时布置，放手不管。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Agent Gardener">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌱%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌱%3C/text%3E%3C/svg%3E">
  <title>Agent Gardener</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="header-left">
        <span class="header-logo">🌱</span>
        <span class="header-title">Agent Gardener</span>
      </div>
      <div class="header-right">
        <button id="theme-toggle" class="icon-btn" aria-label="切换主题">🌙</button>
      </div>
    </header>

    <main id="main" role="main">
      <div id="view-container"></div>
    </main>

    <nav id="bottom-nav" class="bottom-nav">
      <a href="#dashboard" class="nav-item active" data-view="dashboard">
        <span class="nav-icon">🌿</span>
        <span class="nav-label">仪表盘</span>
      </a>
      <a href="#waiting" class="nav-item" data-view="waiting">
        <span class="nav-icon">⏳</span>
        <span class="nav-label">等待中</span>
      </a>
      <a href="#schedule" class="nav-item" data-view="schedule">
        <span class="nav-icon">📅</span>
        <span class="nav-label">日程</span>
      </a>
    </nav>

    <button id="fab" class="fab" aria-label="添加">+</button>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
