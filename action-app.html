<DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4CAF50">
    <meta name="description" content="ActionTrigger - 多巴胺脱敏期的执行脚手架">
    <title>ActionTrigger - 专注模式</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary: #4CAF50; --danger: #F44336; --text: #333; --bg: #f5f5f5; --surface: #fff; }
        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* 视图切换 */
        .view { display: none; height: 100%; flex-direction: column; padding: 20px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
        .view.active { display: flex; }

        /* 首页 */
        #home-view { justify-content: center; align-items: center; text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: #2E7D32; }
        .input-group { width: 100%; max-width: 400px; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 15px; font-size: 1.1rem; border: 2px solid #ddd; border-radius: 12px; outline: none; transition: border 0.3s; }
        input[type="text"]:focus { border-color: var(--primary); }
        .btn-main { width: 100%; max-width: 400px; padding: 15px; font-size: 1.2rem; background: var(--primary); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-main:active { transform: scale(0.98); }
        .menu-trigger { position: absolute; bottom: 20px; left: 20px; font-size: 24px; background: none; border: none; cursor: pointer; opacity: 0.5; }

        /* 计时页 */
        #timer-view { justify-content: space-between; text-align: center; }
        .task-display { font-size: 1.2rem; font-weight: bold; margin-top: 20px; color: #555; word-break: break-all; }
        .timer-display { font-size: 5rem; font-weight: bold; font-variant-numeric: tabular-nums; color: #2E7D32; flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-control { padding: 15px; font-size: 1rem; border: none; border-radius: 10px; color: white; font-weight: bold; min-height: 60px; }
        .btn-inner { background: #FF9800; }
        .btn-outer { background: #2196F3; }
        .btn-done { background: var(--primary); }
        .counter-badge { display: block; font-size: 0.8rem; margin-top: 5px; opacity: 0.9; }

        /* 弹窗 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: white; padding: 25px; border-radius: 16px; width: 90%; max-width: 350px; text-align: center; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal h3 { margin-top: 0; color: #333; }
        .modal-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn-modal { padding: 12px; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: bold; }
        .btn-stop { background: #E0E0E0; color: #333; }
        .btn-ext5 { background: #FF9800; color: white; }
        .btn-ext15 { background: #F44336; color: white; }
        .warning-text { color: #F44336; font-size: 0.9rem; margin-top: 10px; display: none; }

        /* 归档页 */
        #archive-view { justify-content: center; align-items: center; }
        .summary-card { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .xp-gain { color: #4CAF50; font-weight: bold; font-size: 1.2rem; text-align: center; margin: 15px 0; }
        
        /* 进阶面板 */
        #advanced-panel { position: fixed; top: 0; left: -85%; width: 85%; height: 100%; background: white; z-index: 2000; transition: left 0.3s; padding: 20px; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.2); padding-top: env(safe-area-inset-top); }
        #advanced-panel.open { left: 0; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
        .panel-section { margin-bottom: 25px; }
        .panel-title { font-weight: bold; color: #555; margin-bottom: 10px; display: block; }
        .xp-display { font-size: 2rem; color: #4CAF50; font-weight: bold; }
        .inbox-list { list-style: none; padding: 0; }
        .inbox-item { background: #f9f9f9; padding: 10px; margin-bottom: 5px; border-radius: 6px; font-size: 0.9rem; }
        .timeline-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 0.9rem; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; background: #ccc; }
        .dot.done { background: #4CAF50; }
        .btn-small { padding: 5px 10px; font-size: 0.8rem; background: #eee; border: none; border-radius: 4px; cursor: pointer; }
        .btn-danger { background: #ffebee; color: #c62828; }

        /* 辅助类 */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 1. 首页视图 -->
    <div id="home-view" class="view active">
        <h1>准备开始聚焦</h1>
        <div class="input-group">
            <input type="text" id="task-input" placeholder="接下来要做什么？(例如：背单词)" inputmode="text">
        </div>
        <button class="btn-main" onclick="app.startSession()">开始聚焦 (25min)</button>
        <button class="menu-trigger" onclick="app.togglePanel()">≡</button>
    </div>

    <!-- 2. 计时视图 -->
    <div id="timer-view" class="view">
        <div class="task-display" id="timer-task-text">任务加载中...</div>
        <div class="timer-display" id="countdown">25:00</div>
        <div class="controls">
            <button class="btn-control btn-inner" onclick="app.count('internal')">
                +内<span class="counter-badge" id="count-inner">0</span>
            </button>
            <button class="btn-control btn-outer" onclick="app.count('external')">
                +外<span class="counter-badge" id="count-outer">0</span>
            </button>
            <button class="btn-control btn-done" onclick="app.finishSession()">
                完成
            </button>
        </div>
    </div>

    <!-- 3. 归档视图 -->
    <div id="archive-view" class="view">
        <h2>本次聚焦完成</h2>
        <div class="summary-card">
            <div class="stat-row"><span>任务:</span> <strong id="sum-task">-</strong></div>
            <div class="stat-row"><span>时长:</span> <strong id="sum-duration">0m</strong></div>
            <div class="stat-row"><span>内部干扰:</span> <strong id="sum-inner">0</strong></div>
            <div class="stat-row"><span>外部干扰:</span> <strong id="sum-outer">0</strong></div>
            <div class="xp-gain" id="sum-xp">+0 XP</div>
        </div>
        <div class="input-group">
            <input type="text" id="note-input" placeholder="本次主要干扰是______ (可选)">
        </div>
        <button class="btn-main" onclick="app.confirmArchive()">确认归档</button>
    </div>

    <!-- 结束弹窗 -->
    <div id="end-modal" class="modal-overlay">
        <div class="modal">
            <h3>时间到！</h3>
            <p>感觉如何？</p>
            <div class="modal-buttons">
                <button class="btn-modal btn-stop" onclick="app.handleEndChoice('stop')">停止并记录</button>
                <button class="btn-modal btn-ext5" onclick="app.handleEndChoice('ext5')">延长 5 分钟</button>
                <button class="btn-modal btn-ext15" onclick="app.handleEndChoice('ext15')">延长 15 分钟</button>
            </div>
            <p id="ext-warning" class="warning-text">已达最大延长次数，必须归档！</p>
        </div>
    </div>

    <!-- 进阶面板 -->
    <div id="advanced-panel">
        <div class="panel-header">
            <h3>进阶面板</h3>
            <button class="close-btn" onclick="app.togglePanel()">×</button>
        </div>
        
        <div class="panel-section">
            <span class="panel-title">当前 XP</span>
            <div class="xp-display" id="panel-xp">0</div>
        </div>

        <div class="panel-section">
            <span class="panel-title">GTD 收件箱</span>
            <input type="text" id="inbox-input" placeholder="快速捕获想法..." style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #ddd; border-radius:4px;" onkeypress="if(event.key==='Enter') app.addInbox()">
            <button class="btn-small" onclick="app.clearInbox()" style="float:right">清空</button>
            <ul id="inbox-list" class="inbox-list"></ul>
        </div>

        <div class="panel-section">
            <span class="panel-title">最近 7 天</span>
            <div id="timeline-list"></div>
        </div>

        <div class="panel-section">
            <span class="panel-title">设置</span>
            <button class="btn-small" onclick="app.exportData()">导出 TXT</button>
            <button class="btn-small btn-danger" onclick="app.clearAllData()">清除所有数据</button>
            <div style="margin-top:10px; font-size:0.8rem; color:#666;">
                <a href="#" onclick="alert('专注模式 SOP:\n1. 写下唯一任务\n2. 点击开始\n3. 期间任何想法记在便签，不操作手机\n4. 响铃后选择停止或延长')">查看专注 SOP</a>
            </div>
        </div>
    </div>

    <script>
        const app = {
            state: {
                currentView: 'home',
                task: '',
                startTime: 0,
                remainingTime: 25 * 60, // seconds
                timerId: null,
                internalCount: 0,
                externalCount: 0,
                extendCount: 0,
                sessionData: {}
            },
            
            init() {
                this.loadXP();
                this.renderTimeline();
                this.renderInbox();
                // 检查是否有未完成的会话（防止刷新丢失）
                const savedSession = localStorage.getItem('at_active_session');
                if (savedSession) {
                    const data = JSON.parse(savedSession);
                    this.state = { ...this.state, ...data };
                    this.switchView('timer');
                    this.startTimerLogic();
                }
                
                // 注册 Service Worker
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('sw.js').catch(() => console.log('SW registration failed'));
                }
            },

            switchView(viewName) {
                document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
                document.getElementById(`${viewName}-view`).classList.add('active');
                this.state.currentView = viewName;
            },

            togglePanel() {
                const panel = document.getElementById('advanced-panel');
                panel.classList.toggle('open');
                if(panel.classList.contains('open')) {
                    this.loadXP();
                    this.renderTimeline();
                    this.renderInbox();
                }
            },

            startSession() {
                const input = document.getElementById('task-input');
                const task = input.value.trim();
                if (!task) return alert('请输入任务内容');
                
                this.state.task = task;
                this.state.startTime = Date.now();
                this.state.remainingTime = 25 * 60;
                this.state.internalCount = 0;
                this.state.externalCount = 0;
                this.state.extendCount = 0;
                
                document.getElementById('timer-task-text').textContent = task;
                this.updateTimerDisplay();
                this.switchView('timer');
                this.saveSessionState();
                this.startTimerLogic();
            },

            startTimerLogic() {
                if (this.state.timerId) clearInterval(this.state.timerId);
                this.state.timerId = setInterval(() => {
                    const now = Date.now();
                    const elapsed = Math.floor((now - this.state.startTime) / 1000);
                    const totalExpected = (25 * 60) + (this.state.extendCount * 5 * 60); // 基础25 + 延长
                    
                    // 简单逻辑：每次延长增加总时长上限
                    // 更精确逻辑：记录目标结束时间
                    // 这里采用倒计时递减法更稳妥
                    
                    this.state.remainingTime--;
                    if (this.state.remainingTime <= 0) {
                        this.triggerEndModal();
                    } else {
                        this.updateTimerDisplay();
                        this.saveSessionState();
                    }
                }, 1000);
            },

            updateTimerDisplay() {
                const m = Math.floor(this.state.remainingTime / 60).toString().padStart(2, '0');
                const s = (this.state.remainingTime % 60).toString().padStart(2, '0');
                document.getElementById('countdown').textContent = `${m}:${s}`;
                document.title = `${m}:${s} - 聚焦中`;
            },

            count(type) {
                if (type === 'internal') {
                    this.state.internalCount++;
                    document.getElementById('count-inner').textContent = this.state.internalCount;
                } else {
                    this.state.externalCount++;
                    document.getElementById('count-outer').textContent = this.state.externalCount;
                }
                // 震动反馈
                if (navigator.vibrate) navigator.vibrate(50);
                this.saveSessionState();
            },

            triggerEndModal() {
                clearInterval(this.state.timerId);
                const modal = document.getElementById('end-modal');
                const warning = document.getElementById('ext-warning');
                const extBtns = document.querySelectorAll('.btn-ext5, .btn-ext15');
                
                if (this.state.extendCount >= 2) {
                    warning.style.display = 'block';
                    extBtns.forEach(b => b.disabled = true);
                } else {
                    warning.style.display = 'none';
                    extBtns.forEach(b => b.disabled = false);
                }
                modal.style.display = 'flex';
            },

            handleEndChoice(choice) {
                document.getElementById('end-modal').style.display = 'none';
                if (choice === 'stop') {
                    this.finishSession();
                } else if (choice === 'ext5') {
                    this.state.extendCount++;
                    this.state.remainingTime += 5 * 60;
                    this.startTimerLogic();
                } else if (choice === 'ext15') {
                    this.state.extendCount++;
                    this.state.remainingTime += 15 * 60;
                    this.startTimerLogic();
                }
            },

            finishSession() {
                clearInterval(this.state.timerId);
                document.title = "ActionTrigger";
                const durationSec = (25 * 60) + (this.state.extendCount * 5 * 60) - this.state.remainingTime; // 实际经过时间
                // 修正：如果是提前手动完成，计算方式不同。这里简化为：预设总时长 - 剩余 = 已用
                // 更好的方式：Date.now() - startTime
                
                const actualDuration = Math.floor((Date.now() - this.state.startTime) / 1000);
                
                this.state.sessionData = {
                    task: this.state.task,
                    duration: actualDuration,
                    internal: this.state.internalCount,
                    external: this.state.externalCount,
                    timestamp: Date.now()
                };

                // 填充归档页
                document.getElementById('sum-task').textContent = this.state.task;
                document.getElementById('sum-duration').textContent = (actualDuration / 60).toFixed(1) + 'm';
                document.getElementById('sum-inner').textContent = this.state.internalCount;
                document.getElementById('sum-outer').textContent = this.state.externalCount;
                
                // 计算 XP
                let xp = 5; // 启动奖
                if (actualDuration > 24 * 60) xp += 15; // 完成奖
                if (this.state.internalCount > 0 || this.state.externalCount > 0) xp += 2; // 诚实奖
                document.getElementById('sum-xp').textContent = `+${xp} XP`;
                this.state.tempXPGain = xp;

                localStorage.removeItem('at_active_session');
                this.switchView('archive');
            },

            confirmArchive() {
                const note = document.getElementById('note-input').value;
                const session = {
                    id: Date.now(),
                    ...this.state.sessionData,
                    note: note
                };

                // 保存会话历史
                try {
                    const history = JSON.parse(localStorage.getItem('at_sessions') || '[]');
                    history.push(session);
                    localStorage.setItem('at_sessions', JSON.stringify(history));
                } catch (e) {
                    alert('存储已满，请先导出数据！');
                    return;
                }

                // 更新 XP
                try {
                    let xp = parseInt(localStorage.getItem('at_xp') || '0');
                    xp += this.state.tempXPGain;
                    localStorage.setItem('at_xp', xp.toString());
                } catch (e) { console.error('XP save error'); }

                // 重置并回家
                document.getElementById('task-input').value = '';
                document.getElementById('note-input').value = '';
                this.switchView('home');
                this.loadXP();
                this.renderTimeline();
            },

            // --- 数据与面板逻辑 ---
            loadXP() {
                const xp = localStorage.getItem('at_xp') || '0';
                document.getElementById('panel-xp').textContent = xp;
            },

            renderTimeline() {
                const list = document.getElementById('timeline-list');
                list.innerHTML = '';
                const history = JSON.parse(localStorage.getItem('at_sessions') || '[]');
                const now = Date.now();
                const sevenDays = 7 * 86400000;
                
                // 过滤最近7天
                const recent = history.filter(s => now - s.timestamp < sevenDays);
                
                if (recent.length === 0) {
                    list.innerHTML = '<div style="color:#999; font-size:0.9rem;">最近7天无记录</div>';
                    return;
                }

                // 按天分组显示
                const days = {};
                recent.forEach(s => {
                    const date = new Date(s.timestamp).toLocaleDateString();
                    if (!days[date]) days[date] = [];
                    days[date].push(s);
                });

                for (const [date, sessions] of Object.entries(days)) {
                    const div = document.createElement('div');
                    div.style.marginBottom = '15px';
                    div.innerHTML = `<strong>${date}</strong>`;
                    sessions.forEach(s => {
                        div.innerHTML += `
                            <div class="timeline-item">
                                <div class="dot done"></div>
                                <span>${s.task} <small style="color:#888">(${(s.duration/60).toFixed(0)}m)</small></span>
                            </div>
                        `;
                    });
                    list.appendChild(div);
                }
            },

            addInbox() {
                const input = document.getElementById('inbox-input');
                const val = input.value.trim();
                if (!val) return;
                try {
                    const inbox = JSON.parse(localStorage.getItem('at_inbox') || '[]');
                    inbox.unshift({ text: val, time: Date.now() });
                    localStorage.setItem('at_inbox', JSON.stringify(inbox));
                    input.value = '';
                    this.renderInbox();
                } catch(e) { alert('存储已满'); }
            },

            renderInbox() {
                const list = document.getElementById('inbox-list');
                list.innerHTML = '';
                const inbox = JSON.parse(localStorage.getItem('at_inbox') || '[]');
                inbox.forEach((item, idx) => {
                    const li = document.createElement('li');
                    li.className = 'inbox-item';
                    li.textContent = item.text;
                    li.onclick = () => {
                        if(confirm('删除这条？')) {
                            inbox.splice(idx, 1);
                            localStorage.setItem('at_inbox', JSON.stringify(inbox));
                            this.renderInbox();
                        }
                    };
                    list.appendChild(li);
                });
            },

            clearInbox() {
                if(confirm('确定清空收件箱吗？（仅清空列表，不影响历史归档）')) {
                    localStorage.setItem('at_inbox', '[]');
                    this.renderInbox();
                }
            },

            exportData() {
                const sessions = localStorage.getItem('at_sessions');
                const xp = localStorage.getItem('at_xp');
                const blob = new Blob([`XP: ${xp}\n\nSessions:\n${sessions}`], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `actiontrigger_backup_${Date.now()}.txt`;
                a.click();
            },

            clearAllData() {
                if(confirm('警告：这将删除所有历史记录和XP，无法恢复！确定吗？')) {
                    localStorage.removeItem('at_sessions');
                    localStorage.removeItem('at_xp');
                    localStorage.removeItem('at_inbox');
                    location.reload();
                }
            },

            saveSessionState() {
                try {
                    localStorage.setItem('at_active_session', JSON.stringify(this.state));
                } catch (e) {
                    console.error('Storage full');
                }
            }
        };

        // 初始化
        window.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
