<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e74c3c" />
  <meta name="description" content="Pomotodo — 番茄钟 + GTD 时间管理工具" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./style.css" />
  <title>Pomotodo</title>
</head>
<body data-theme="light">

  <!-- ===== Header ===== -->
  <header class="app-header">
    <h1 class="app-logo">🍅 Pomotodo</h1>
    <nav class="header-nav">
      <button class="nav-btn active" data-view="work">工作台</button>
      <button class="nav-btn" data-view="stats">统计</button>
      <button class="nav-btn" data-view="settings">设置</button>
    </nav>
  </header>

  <!-- ===== Work View (双栏) ===== -->
  <main class="view work-view active" id="view-work">

    <!-- 左栏: 番茄钟 -->
    <section class="panel panel-timer">
      <div class="timer-modes">
        <button class="mode-btn active" data-mode="work">🍅 专注</button>
        <button class="mode-btn" data-mode="shortBreak">☕ 短休息</button>
        <button class="mode-btn" data-mode="longBreak">🌿 长休息</button>
      </div>

      <div class="timer-ring-wrap">
        <svg class="timer-ring" viewBox="0 0 200 200">
          <circle class="ring-track" cx="100" cy="100" r="88" />
          <circle class="ring-fill" cx="100" cy="100" r="88" />
        </svg>
        <div class="timer-center">
          <span class="timer-digits">25:00</span>
          <span class="timer-cycle">#1</span>
        </div>
      </div>

      <div class="timer-actions">
        <button class="btn-timer secondary" id="btn-reset" title="重置">↺</button>
        <button class="btn-timer primary" id="btn-start">▶ 开始专注</button>
        <button class="btn-timer secondary" id="btn-skip" title="跳过">⏭</button>
      </div>

      <div class="timer-active-task" id="timer-active-task"></div>

      <!-- 今日已完成 -->
      <div class="done-today">
        <h3 class="done-heading">今日已完成 <span class="done-count" id="done-count">0</span></h3>
        <ul class="done-list" id="done-list"></ul>
      </div>
    </section>

    <!-- 右栏: 土豆清单 -->
    <section class="panel panel-tasks">
      <div class="task-input-wrap">
        <input type="text" class="task-input" id="task-input"
               placeholder="添加土豆… 用 #标签 分类" maxlength="120" />
        <button class="task-add-btn" id="task-add-btn">＋</button>
      </div>

      <div class="task-filters">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="active">待办</button>
        <button class="filter-btn" data-filter="completed">已完成</button>
      </div>

      <ul class="task-list" id="task-list"></ul>
    </section>
  </main>

  <!-- ===== Stats View ===== -->
  <main class="view stats-view" id="view-stats">
    <div class="stats-cards">
      <div class="stat-card"><div class="stat-val" id="s-today-count">0</div><div class="stat-lbl">今日番茄</div></div>
      <div class="stat-card"><div class="stat-val" id="s-today-mins">0m</div><div class="stat-lbl">今日专注</div></div>
      <div class="stat-card"><div class="stat-val" id="s-week-count">0</div><div class="stat-lbl">本周番茄</div></div>
    </div>
    <div class="stats-chart-box">
      <h3>最近 7 天</h3>
      <canvas id="chart-weekly"></canvas>
    </div>
    <div class="stats-tags-box">
      <h3>标签分布</h3>
      <div class="tag-bars" id="tag-bars"></div>
    </div>
    <div class="stats-io">
      <button class="btn-sm" id="btn-export">📥 导出数据</button>
      <label class="btn-sm label-btn">📤 导入数据<input type="file" id="btn-import" accept=".json" hidden /></label>
    </div>
  </main>

  <!-- ===== Settings View ===== -->
  <main class="view settings-view" id="view-settings">
    <section class="sett-group">
      <h3>外观</h3>
      <div class="sett-row"><span>主题</span>
        <div class="toggle-pair">
          <button class="t-btn active" data-theme="light">☀ 浅色</button>
          <button class="t-btn" data-theme="dark">🌙 深色</button>
        </div>
      </div>
    </section>
    <section class="sett-group">
      <h3>计时器</h3>
      <div class="sett-row"><label for="opt-work">专注 (分钟)</label><input type="number" id="opt-work" class="sett-num" min="1" max="90" value="25" /></div>
      <div class="sett-row"><label for="opt-short">短休息 (分钟)</label><input type="number" id="opt-short" class="sett-num" min="1" max="30" value="5" /></div>
      <div class="sett-row"><label for="opt-long">长休息 (分钟)</label><input type="number" id="opt-long" class="sett-num" min="1" max="60" value="15" /></div>
      <div class="sett-row"><label for="opt-interval">长休息间隔</label><input type="number" id="opt-interval" class="sett-num" min="2" max="10" value="4" /></div>
      <div class="sett-row"><span>自动开始休息</span><label class="sw"><input type="checkbox" id="opt-auto-break" checked /><span class="sw-track"></span></label></div>
      <div class="sett-row"><span>自动开始专注</span><label class="sw"><input type="checkbox" id="opt-auto-work" /><span class="sw-track"></span></label></div>
    </section>
    <section class="sett-group">
      <h3>声音 & 通知</h3>
      <div class="sett-row"><span>提示音</span><label class="sw"><input type="checkbox" id="opt-sound" checked /><span class="sw-track"></span></label></div>
      <div class="sett-row"><span>音量</span><input type="range" id="opt-volume" class="sett-range" min="0" max="1" step="0.1" value="0.7" /><span class="range-val" id="range-val">70%</span></div>
      <div class="sett-row"><span>浏览器通知</span><label class="sw"><input type="checkbox" id="opt-notify" /><span class="sw-track"></span></label></div>
      <div class="sett-row"><span></span><button class="btn-sm" id="btn-test-sound">🔊 测试提示音</button></div>
    </section>
    <section class="sett-group danger">
      <h3>数据</h3>
      <div class="sett-row"><span>重置设置</span><button class="btn-sm btn-warn" id="btn-reset-sett">恢复默认</button></div>
      <div class="sett-row"><span>清除全部数据</span><button class="btn-sm btn-danger" id="btn-clear-all">⚠ 清除</button></div>
    </section>
  </main>

  <!-- 完成确认弹窗 -->
  <div class="modal-overlay" id="modal-complete" hidden>
    <div class="modal-box">
      <h3>🍅 番茄完成！</h3>
      <p class="modal-sub" id="modal-sub">刚刚完成了 25 分钟专注</p>
      <div class="modal-tasks" id="modal-tasks"></div>
      <div class="modal-actions">
        <button class="btn-sm" id="modal-skip">跳过</button>
        <button class="btn-sm btn-primary" id="modal-confirm">确认</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-wrap" id="toast-wrap"></div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
